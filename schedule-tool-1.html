const FB_URL = "https://kawara-36-default-rtdb.asia-southeast1.firebasedatabase.app";

async function fbGet(path) {
  const res = await fetch(`${FB_URL}/${path}.json`);
  return res.ok ? res.json() : null;
}
async function fbSet(path, data) {
  await fetch(`${FB_URL}/${path}.json`, {
    method: "PUT", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data),
  });
}
async function fbPatch(path, data) {
  await fetch(`${FB_URL}/${path}.json`, {
    method: "PATCH", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data),
  });
}

// ============================================================
// UTILS
// ============================================================
function toDateStr(y, m, d) {
  return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
}
function parseDate(str) {
  const [y, m, d] = str.split("-").map(Number);
  return { y, m, d };
}
function getDaysInMonth(year, month) { return new Date(year, month, 0).getDate(); }
function getFirstDayOfWeek(year, month) { return new Date(year, month - 1, 1).getDay(); }
function formatDateJP(str) {
  const { y, m, d } = parseDate(str);
  const days = ["日","月","火","水","木","金","土"];
  const dow = new Date(y, m - 1, d).getDay();
  return `${m}/${d}(${days[dow]})`;
}
